<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
<title id="title">hai-stack：一次迭代的每一步都有技能接手</title>
<desc id="desc">一次迭代分五步：判断、设计、动手、确认、沉淀，每一步列出接手的技能。geju、goudi、hai-razor 三个纠偏视角在任何一步都能调用。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#EA580C"/></marker>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .mono { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>
</defs>
<rect width="1400" height="900" fill="#FAF9F7"/>
<rect x="48" y="58" width="40" height="5" rx="2.5" fill="#EA580C"/>
<text x="104" y="66" font-size="16" font-weight="700" fill="#EA580C" letter-spacing="1.8">HAI-STACK · 软件迭代</text>
<text x="48" y="122" font-size="38" font-weight="700" fill="#1C1917">一次迭代的每一步，都有技能接手</text>
<text x="48" y="160" font-size="18" font-weight="400" fill="#78716C">卡在哪一步，就从哪一步进入。每个技能交出能检查的结果，不要求每次走完一圈。</text>
